<title>오늘의 러닝운세</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* Layout: a race bib (배번) pinned to the page. The reel is the big line on the bib,
     the timing fields below it are the slot machine's other windows. */
  :root {
    --bg: #E6ECF0;
    --ink: #0F1B2D;
    --muted: #4D5C73;
    --line: #C6D1DB;
    --band: #1E4FFF;
    --band-ink: #FFFFFF;
    --hi: #FFD21F;
    --shadow: 0 1px 0 rgba(15, 27, 45, .06), 0 14px 32px -14px rgba(15, 27, 45, .35);

    /* bib paper stays paper in both themes */
    --paper: #FBFCFD;
    --paper-ink: #0F1B2D;
    --paper-muted: #55647B;
    --paper-line: #D5DDE5;
    --stamp-good: #1E4FFF;
    --stamp-flat: #55647B;
    --stamp-bad: #C42B3A;

    --display: 'Do Hyeon', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --body: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0A111C;
      --ink: #E8EEF5;
      --muted: #8E9DB3;
      --line: #223047;
      --band: #3D66FF;
      --shadow: 0 1px 0 rgba(0, 0, 0, .4), 0 16px 34px -14px rgba(0, 0, 0, .7);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0A111C;
    --ink: #E8EEF5;
    --muted: #8E9DB3;
    --line: #223047;
    --band: #3D66FF;
    --shadow: 0 1px 0 rgba(0, 0, 0, .4), 0 16px 34px -14px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }

  html, body { background: var(--bg); }
  body {
    color: var(--ink);
    font: 400 16px/1.55 var(--body);
    padding-block: 28px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
  h1 {
    margin: 0;
    font: 400 clamp(2rem, 8vw, 2.6rem)/1.1 var(--display);
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .sub { margin: 6px 0 0; color: var(--muted); font-size: .95rem; }

  /* ---------- bib ---------- */
  .bib {
    position: relative;
    background: var(--paper);
    color: var(--paper-ink);
    border-radius: 6px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .hole {
    position: absolute;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--bg);
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, .35);
    z-index: 2;
  }
  .hole.tl { top: 10px; left: 10px; }
  .hole.tr { top: 10px; right: 10px; }
  .hole.bl { bottom: 10px; left: 10px; }
  .hole.br { bottom: 10px; right: 10px; }

  .band {
    background: var(--band);
    color: var(--band-ink);
    padding: 14px 40px;
    font: 700 .82rem/1.3 var(--body);
    letter-spacing: .06em;
    text-align: center;
  }
  .bibhead {
    display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap;
    padding: 18px 24px 14px;
  }
  .tag {
    font: 500 .68rem/1.2 var(--mono);
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--paper-muted);
  }
  .bibno {
    font: 600 clamp(2.6rem, 13vw, 4rem)/1 var(--mono);
    letter-spacing: .02em;
    font-variant-numeric: tabular-nums;
  }
  .date { font: 500 .78rem/1.4 var(--mono); color: var(--paper-muted); text-align: right; }

  .perf { border: 0; border-top: 2px dashed var(--paper-line); margin: 0; }

  .reel { padding: 16px 24px 20px; }
  .reeltext-wrap { margin-top: 8px; min-height: calc(1.35em * 5); }
  .reeltext {
    margin: 0;
    font: 400 clamp(1.4rem, 5.6vw, 1.95rem)/1.35 var(--display);
    text-wrap: balance;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  .reeltext.tick { animation: drop var(--tickdur, 120ms) ease-out; }
  @keyframes drop {
    from { transform: translateY(-35%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .grade { display: flex; align-items: center; gap: 16px; padding: 4px 24px 20px; }
  .stamp {
    flex: none;
    width: 78px; height: 78px;
    border: 3px solid currentColor;
    border-radius: 50%;
    display: grid; place-items: center;
    font: 400 1.65rem/1 var(--display);
    color: var(--stamp-flat);
    transform: rotate(-9deg);
    box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 4px currentColor;
  }
  .stamp[data-tone="good"] { color: var(--stamp-good); }
  .stamp[data-tone="bad"] { color: var(--stamp-bad); }
  .stamp.pop { animation: pop 380ms cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes pop {
    from { transform: rotate(-24deg) scale(1.7); opacity: 0; }
    to { transform: rotate(-9deg) scale(1); opacity: 1; }
  }
  .gradetext { min-width: 0; }
  .gradetext p { margin: 2px 0 0; font-size: .98rem; font-weight: 500; }

  .fields {
    margin: 0;
    padding: 0 24px 26px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 0;
  }
  .field { padding: 12px 0; border-top: 1px solid var(--paper-line); min-width: 0; }
  .field dt { margin: 0; }
  .field dd { margin: 4px 0 0; min-width: 0; }
  .val { font: 400 1.5rem/1.25 var(--display); overflow-wrap: anywhere; }
  .val.mono { font-family: var(--mono); font-weight: 600; font-size: 1.45rem; font-variant-numeric: tabular-nums; }
  .cap { display: block; margin-top: 2px; font-size: .86rem; color: var(--paper-muted); min-height: 1.3em; }
  .bib.spinning .field .cap { visibility: hidden; }
  .bib.spinning .val { opacity: .55; }

  @media (min-width: 520px) {
    .fields { grid-template-columns: 1fr 1fr; column-gap: 28px; }
  }

  /* ---------- controls ---------- */
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    font: 700 1rem/1 var(--body);
    border-radius: 999px;
    padding: 17px 24px;
    cursor: pointer;
    min-height: 52px;
  }
  .go {
    flex: 1 1 220px;
    background: var(--band);
    color: var(--band-ink);
    border: 2px solid var(--band);
  }
  .go:hover { filter: brightness(1.08); }
  .go:disabled { cursor: progress; filter: none; opacity: .75; }
  .copy {
    flex: 0 1 auto;
    background: transparent;
    color: var(--ink);
    border: 2px solid var(--ink);
  }
  .copy:disabled { opacity: .4; cursor: not-allowed; }
  button:focus-visible { outline: 3px solid var(--hi); outline-offset: 3px; }

  .note { margin: 0; color: var(--muted); font-size: .88rem; }
  .copied { min-height: 1.4em; margin: -10px 0 0; color: var(--muted); font-size: .88rem; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    .reeltext.tick, .stamp.pop { animation: none; }
  }
</style>

<main class="wrap">
  <header>
    <h1>오늘의 러닝운세</h1>
    <p class="sub">버튼을 누르면 배번과 운세가 같이 돌아갑니다.</p>
  </header>

  <section class="bib" id="bib" aria-labelledby="bibtitle">
    <span class="hole tl"></span><span class="hole tr"></span>
    <span class="hole bl"></span><span class="hole br"></span>
    <div class="band" id="bibtitle">제1회 오늘의 러닝운세 대회</div>

    <div class="bibhead">
      <div>
        <div class="tag">BIB No. 배번</div>
        <div class="bibno" id="bibNo">0000</div>
      </div>
      <div class="date" id="today">오늘</div>
    </div>

    <hr class="perf">

    <div class="reel" aria-live="polite" aria-busy="false" id="reel">
      <div class="tag">FORTUNE 오늘의 한 줄</div>
      <div class="reeltext-wrap">
        <p class="reeltext" id="reelText">버튼을 누르면 운세가 정해집니다.</p>
      </div>
    </div>

    <div class="grade">
      <div class="stamp" id="stamp" data-tone="flat">?</div>
      <div class="gradetext">
        <div class="tag">GRADE 오늘의 등급</div>
        <p id="gradeSub">아직 아무도 모릅니다.</p>
      </div>
    </div>

    <hr class="perf">

    <dl class="fields">
      <div class="field">
        <dt class="tag">PACE 행운의 페이스</dt>
        <dd><span class="val mono" id="paceVal">0:00 /km</span><span class="cap" id="paceCap"></span></dd>
      </div>
      <div class="field">
        <dt class="tag">DIST 행운의 거리</dt>
        <dd><span class="val mono" id="distVal">0.0 km</span><span class="cap" id="distCap"></span></dd>
      </div>
      <div class="field">
        <dt class="tag">ITEM 행운의 아이템</dt>
        <dd><span class="val" id="itemVal">-</span><span class="cap" id="itemCap"></span></dd>
      </div>
      <div class="field">
        <dt class="tag">CAUTION 오늘의 주의</dt>
        <dd><span class="val" id="cautionVal">-</span><span class="cap" id="cautionCap"></span></dd>
      </div>
    </dl>
  </section>

  <div class="actions">
    <button type="button" class="go" id="spinBtn">오늘의 운세 돌리기</button>
    <button type="button" class="copy" id="copyBtn" disabled>운세 복사</button>
  </div>
  <p class="copied" id="copied" role="status"></p>
  <p class="note">마음에 들 때까지 돌려도 반칙이 아닙니다. 과학적 근거는 전혀 없으니 재미로만 보세요. 다리가 아프면 그냥 쉬세요.</p>
  <span class="sr" id="live" role="status"></span>
</main>

  ];

  var ITEM_CAPS = ["오늘만 효과가 있습니다", "없어도 됩니다", "있으면 기분이 좋습니다", "효과는 본인만 압니다", "일단 챙기세요"];
  var CAUTION_CAPS = ["조심하세요", "너무 놀라진 마세요", "피할 수 있으면 피하세요", "웃으며 넘기세요", "대비책은 없습니다"];

  var $ = function (id) { return document.getElementById(id); };
  var bib = $("bib"), reel = $("reel"), reelText = $("reelText"), bibNo = $("bibNo");
  var stamp = $("stamp"), gradeSub = $("gradeSub");
  var paceVal = $("paceVal"), paceCap = $("paceCap"), distVal = $("distVal"), distCap = $("distCap");
  var itemVal = $("itemVal"), itemCap = $("itemCap"), cautionVal = $("cautionVal"), cautionCap = $("cautionCap");
  var spinBtn = $("spinBtn"), copyBtn = $("copyBtn"), copied = $("copied"), live = $("live");

  var reduced = false;
  try { reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}

  var spinning = false, spinCount = 0, current = null, lastHeadline = -1, copyTimer = null;

  function rnd(n) { return Math.floor(Math.random() * n); }
  function pick(a) { return a[rnd(a.length)]; }
  function pad4(n) { var s = String(n); while (s.length < 4) s = "0" + s; return s; }

  var pool = [];
  GRADES.forEach(function (g) { for (var i = 0; i < g.w; i++) pool.push(g); });

  function randomPace() {
    var total = 4 * 60 + 20 + rnd(4 * 60 + 30);
    var m = Math.floor(total / 60), s = total % 60;
    return m + ":" + (s < 10 ? "0" : "") + s + " /km";
  }

  function newFortune() {
    var hi;
    do { hi = rnd(HEADLINES.length); } while (hi === lastHeadline && HEADLINES.length > 1);
    lastHeadline = hi;
    var d = pick(DISTS);
    return {
      bib: pad4(rnd(10000)),
      headline: HEADLINES[hi],
      grade: pick(pool),
      pace: randomPace(), paceCap: pick(PACE_CAPS),
      dist: d[0] + " km", distCap: d[1],
      item: pick(ITEMS), itemCap: pick(ITEM_CAPS),
      caution: pick(CAUTIONS), cautionCap: pick(CAUTION_CAPS)
    };
  }

  function setHeadline(text, dur) {
    reelText.textContent = text;
    if (reduced) return;
    reelText.style.setProperty("--tickdur", dur + "ms");
    reelText.classList.remove("tick");
    void reelText.offsetWidth;
    reelText.classList.add("tick");
  }

  function scramble(dur) {
    bibNo.textContent = pad4(rnd(10000));
    paceVal.textContent = randomPace();
    distVal.textContent = pick(DISTS)[0] + " km";
    itemVal.textContent = pick(ITEMS);
    cautionVal.textContent = pick(CAUTIONS);
    var h;
    do { h = rnd(HEADLINES.length); } while (HEADLINES[h] === reelText.textContent);
    setHeadline(HEADLINES[h], dur);
  }

  function showFinal(f) {
    bibNo.textContent = f.bib;
    setHeadline(f.headline, 220);
    stamp.textContent = f.grade.name;
    stamp.setAttribute("data-tone", f.grade.tone);
    gradeSub.textContent = f.grade.sub;
    paceVal.textContent = f.pace; paceCap.textContent = f.paceCap;
    distVal.textContent = f.dist; distCap.textContent = f.distCap;
    itemVal.textContent = f.item; itemCap.textContent = f.itemCap;
    cautionVal.textContent = f.caution; cautionCap.textContent = f.cautionCap;
    current = f;
  }

  function spin() {
    if (spinning) return;
    spinning = true;
    spinBtn.disabled = true;
    copyBtn.disabled = true;
    copied.textContent = "";
    bib.classList.add("spinning");
    reel.setAttribute("aria-busy", "true");
    stamp.textContent = "?";
    stamp.setAttribute("data-tone", "flat");
    gradeSub.textContent = "운세가 돌아가는 중입니다.";
    spinBtn.textContent = "돌아가는 중…";

    var target = newFortune();
    var steps = reduced ? 3 : 18 + rnd(5);
    var delay = reduced ? 120 : 55;
    var i = 0;

    function tick() {
      i++;
      if (i < steps) {
        scramble(Math.min(Math.round(delay * 0.85), 220));
        delay *= reduced ? 1.3 : 1.14;
        setTimeout(tick, delay);
      } else {
        finish();
      }
    }

    function finish() {
      showFinal(target);
      bib.classList.remove("spinning");
      reel.setAttribute("aria-busy", "false");
      if (!reduced) {
        stamp.classList.remove("pop");
        void stamp.offsetWidth;
        stamp.classList.add("pop");
      }
      spinCount++;
      spinBtn.disabled = false;
      copyBtn.disabled = false;
      spinBtn.textContent = "다시 돌리기 (오늘 " + spinCount + "번째)";
      live.textContent = "운세가 나왔습니다. " + target.grade.name + ". " + target.headline;
      spinning = false;
    }

    setTimeout(tick, delay);
  }

  function fortuneText() {
    if (!current) return "";
    return "[오늘의 러닝운세] " + current.grade.name + " - " + current.grade.sub + "\n" +
      current.headline + "\n" +
      "행운의 페이스: " + current.pace + " (" + current.paceCap + ")\n" +
      "행운의 거리: " + current.dist + " (" + current.distCap + ")\n" +
      "행운의 아이템: " + current.item + "\n" +
      "오늘의 주의: " + current.caution;
  }

  function say(msg) {
    copied.textContent = msg;
    clearTimeout(copyTimer);
    copyTimer = setTimeout(function () { copied.textContent = ""; }, 3500);
  }

  function fallbackCopy(text) {
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "0";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }

  copyBtn.addEventListener("click", function () {
    var text = fortuneText();
    if (!text) return;
    function fail() {
      if (fallbackCopy(text)) say("운세를 복사했어요.");
      else say("복사가 막혀 있어요. 화면의 문구를 직접 선택해서 복사해 주세요.");
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { say("운세를 복사했어요."); }, fail);
      } else { fail(); }
    } catch (e) { fail(); }
  });

  spinBtn.addEventListener("click", spin);

  try {
    $("today").textContent = new Date().toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "long" });
  } catch (e) {}

  /* Open in a working state: show a first fortune right away. */
  showFinal(newFortune());
  copyBtn.disabled = false;
})();
</script>

</body></html>
